<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English - Chapter 4</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6a5, #caffbf);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff6b6b;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #f08c00;
            font-size: 30px;
        }

        .icon {
            font-size: 80px;
            margin: 20px;
        }

        .welcome {
            background: #e7f5ff;
            border: 4px solid #74c0fc;
            border-radius: 20px;
            padding: 20px;
            font-size: 22px;
            color: #444;
        }

        .chapter-card {
            margin-top: 25px;
            padding: 20px;
            background: #d3f9d8;
            border-radius: 20px;
            color: #2b8a3e;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #845ef7;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
        }

        .back:hover {
            background: #5f3dc4;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌈 English Fun 🌈</h1>

        <h2>🌟 Chapter 4 🌟</h2>

        <div class="icon">
            🦁 📚 🎨
        </div>

        <div class="welcome">
            Welcome to Chapter 4! 🎉
            <br><br>
            Let's learn English together! 🌟
        </div>

        <div class="chapter-card">
            🚀 Chapter 4 is ready!
            <br><br>
            Keep learning and have fun! 😊
        </div>

        <a class="back" href="../">
            🏠 Back to English
        </a>

    </div>

</body>
</html>
