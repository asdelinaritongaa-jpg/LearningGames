<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English - Chapter 1</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #c7f9ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff6b6b;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #845ef7;
            font-size: 30px;
        }

        .icon {
            font-size: 80px;
            margin: 20px;
        }

        .welcome {
            background: #fff3bf;
            border: 4px solid #ffd43b;
            border-radius: 20px;
            padding: 20px;
            font-size: 22px;
            color: #444;
        }

        .chapter-card {
            margin-top: 25px;
            padding: 20px;
            background: #d0ebff;
            border-radius: 20px;
            color: #1971c2;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #845ef7;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
        }

        .back:hover {
            background: #5f3dc4;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌈 English Fun 🌈</h1>

        <h2>⭐ Chapter 1 ⭐</h2>

        <div class="icon">
            🐰 📚 🌟
        </div>

        <div class="welcome">
            Welcome to Chapter 1! 🎉
            <br><br>
            Let's learn English together! 😊
        </div>

        <div class="chapter-card">
            🚀 Chapter 1 is ready!
            <br><br>
            Get ready to learn and have fun! 🎈
        </div>

        <a class="back" href="../">
            🏠 Back to English
        </a>

    </div>

</body>
</html>
