<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333333;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #faf8f5;
    }
    .header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }
    p {
      margin: 0;
      font-size: 14px;
    }
    .content {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Judul Dokumen</h1>
    <p>Deskripsi singkat atau sub-judul dokumen di sini.</p>
  </div>

  <div class="content">
    <p>Tuliskan isi konten dokumen Anda di bagian ini.</p>
  </div>

</body>
</html>
