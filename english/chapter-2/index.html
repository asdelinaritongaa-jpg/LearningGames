<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English - Chapter 2</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff6b6b;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #6c5ce7;
            font-size: 30px;
        }

        .icon {
            font-size: 80px;
            margin: 20px;
        }

        .welcome {
            background: #fff3bf;
            border: 4px solid #ffd43b;
            border-radius: 20px;
            padding: 20px;
            font-size: 22px;
            color: #444;
        }

        .game-card {
            margin-top: 25px;
            padding: 25px;
            background: #d0ebff;
            border-radius: 20px;
            color: #1971c2;
        }

        .game-card h3 {
            font-size: 25px;
            margin-top: 0;
        }

        .game-card p {
            font-size: 20px;
            color: #444;
        }

        .levels {
            font-size: 20px;
            font-weight: bold;
            color: #6c5ce7;
            margin: 15px 0;
        }

        .play-button {
            display: inline-block;
            margin-top: 10px;
            padding: 18px 35px;
            background: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            border: 4px solid #ffd43b;
            transition: 0.3s;
        }

        .play-button:hover {
            background: #fa5252;
            transform: scale(1.08);
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #845ef7;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
        }

        .back:hover {
            background: #5f3dc4;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌈 English Fun 🌈</h1>

    <h2>⭐ Chapter 2 ⭐</h2>

    <div class="icon">
        👨‍👩‍👧‍👦 📚 🎮
    </div>

    <div class="welcome">
        🎉 Welcome to Chapter 2!
        <br><br>
        Let's learn English and have fun with
        <strong>My Family!</strong> ❤️
    </div>

    <div class="game-card">

        <h3>🎮 CHAPTER 2 GAME</h3>

        <p>
            Ready to become an English Family Explorer?
        </p>

        <div class="levels">
            ⭐ 10 Levels ⭐
        </div>

        <a
            href="https://asdelinaritongaa-jpg.github.io/LearningGames/english/chapter-2/game/index.html"
            class="play-button">
            🚀 PLAY GAME
        </a>

    </div>

    <a
        href="https://asdelinaritongaa-jpg.github.io/LearningGames/english/index.html"
        class="back">
        🏠 Back to English
    </a>

</div>

</body>
</html>
