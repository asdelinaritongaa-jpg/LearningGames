<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Games</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .chapters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .chapter {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .chapter a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<header>
    <h1>🇬🇧 English Games</h1>
    <p>Choose a Chapter</p>
</header>

<div class="container">

    <a href="../" class="back">← Back to Home</a>

    <div class="chapters">

        <div class="chapter">
            <h2>Chapter 1</h2>
            <a href="chapter-1/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 2</h2>
            <a href="chapter-2/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 3</h2>
            <a href="chapter-3/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 4</h2>
            <a href="chapter-4/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 5</h2>
            <a href="chapter-5/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 6</h2>
            <a href="chapter-6/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 7</h2>
            <a href="chapter-7/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 8</h2>
            <a href="chapter-8/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 9</h2>
            <a href="chapter-9/">Play</a>
        </div>

        <div class="chapter">
            <h2>Chapter 10</h2>
            <a href="chapter-10/">Play</a>
        </div>

    </div>

</div>

</body>
</html>
