<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Games</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            text-align: center;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 50px 20px;
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .subjects {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .emoji {
            font-size: 60px;
        }

        .button {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Learning Games</h1>
    <p>Belajar sambil bermain!</p>
</header>

<div class="container">

    <h2>📚 Pilih Mata Pelajaran</h2>

   <div class="subjects">

    <div class="card">
        <div class="emoji">🇬🇧</div>
        <h2>Bahasa Inggris</h2>
        <p>10 Chapters</p>
        <a class="button" href="english/">Mulai</a>
    </div>

    <div class="card">
        <div class="emoji">🔬</div>
        <h2>IPAS</h2>
        <p>10 Chapters</p>
        <a class="button" href="ipas/">Mulai</a>
    </div>

</div>

    </div>

</div>

</body>
</html>
